<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Receipt{% endblock %}</title>
<style>
  :root { color-scheme: light; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; background: #fafaf8; color: #1a1a1a; max-width: 1100px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
  a { color: #1d4ed8; }
  .muted { color: #666; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e5e0; vertical-align: top; }
  th { font-weight: 600; color: #444; background: #f1f1ec; }
  td.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; max-width: 520px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .agent { background: #dbeafe; color: #1e3a8a; }
  .human { background: #dcfce7; color: #14532d; }
  .unknown { background: #fef3c7; color: #78350f; }
  .covered { background: #dcfce7; color: #14532d; }
  .partial { background: #fef3c7; color: #78350f; }
  .not { background: #fee2e2; color: #7f1d1d; }
  .totals { display: flex; gap: 24px; flex-wrap: wrap; }
  .totals div { background: #fff; border: 1px solid #e5e5e0; border-radius: 8px; padding: 10px 14px; min-width: 120px; }
  .totals b { font-size: 20px; display: block; }
  .note { font-size: 12px; color: #666; }
  nav { margin: 6px 0 18px; }
  .empty { padding: 14px; background: #fff; border: 1px dashed #ccc; border-radius: 8px; color: #666; }
</style>
</head>
<body>
<h1><a href="/" style="text-decoration:none;color:inherit">Agent Receipt</a></h1>
<div class="muted">A statement of every side-effect action an AI agent took on this machine. Local only.</div>
{% block body %}{% endblock %}

<h2>What this receipt covers</h2>
<table>
  <tr><th style="width:38%">Source</th><th style="width:12%">Status</th><th>Detail</th></tr>
  {% for name, status, detail in coverage_notes %}
  <tr>
    <td>{{ name }}</td>
    <td><span class="pill {{ 'covered' if status == 'covered' else 'partial' if status == 'partial' else 'not' }}">{{ status }}</span></td>
    <td class="note">{{ detail }}</td>
  </tr>
  {% endfor %}
</table>
</body>
</html>
